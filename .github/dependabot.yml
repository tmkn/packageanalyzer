version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 15
      ignore:
          - dependency-name: "@types/express"
            versions:
                - "> 4.17.7, < 4.18"
          - dependency-name: "@types/node"
            versions:
                - 14.14.30
                - 14.14.34
                - 15.0.0
          - dependency-name: typescript
            versions:
                - 4.2.4
